<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Toolchain: hello.mx goes through mortc (my compiler) to freestanding C, then zig cc cross-compiles to i386, producing mortos.iso (Limine BIOS/UEFI) that boots a real PC from a USB stick. Inside the ISO, all in Mort: drivers, MortFS v2, users and sudo, a desktop with apps, the mortnet TCP/IP stack, int 0x80 syscalls. Dev loop: an AI agent boots it through qemu-mcp and debugs it through gdbstub-mcp.">
