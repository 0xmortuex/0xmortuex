<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Fadi (0xmortuex), 10th grade, Istanbul. I build the whole stack, compiler to agent: a language (Mort), an OS written in it (MORT OS), a TCP/IP stack for it (mortnet), and 13 MCP servers that let AI agents boot, debug and read hardware.">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="329" rx="16" fill="#0a0d14" stroke="#232a3b"/>
  <rect x="1" y="1" width="878" height="328" rx="16" fill="url(#dots)"/>
  <rect x="1" y="1" width="878" height="328" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="878" height="328" rx="16" fill="url(#glow2)"/>
  <text x="40" y="58" font-size="12" letter-spacing="2.4" fill="#9aa3b5" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">FADI · 0XMORTUEX · ISTANBUL</text>
  <rect x="40" y="76" width="118" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45"/>
  <circle cx="55" cy="88" r="3.5" fill="#34d399"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="66" y="92.5" font-size="11.5" fill="#eef1f7" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">10th grade</text>
  <text x="40" y="148" font-size="33" font-weight="800" fill="#eef1f7" letter-spacing="-0.8" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">I build the whole stack —</text>
  <text x="40" y="190" font-size="33" font-weight="800" fill="url(#accent)" letter-spacing="-0.8" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">compiler to agent.</text>
  <text x="40" y="236" font-size="15" fill="#9aa3b5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">I wrote a language, an OS in it, a TCP/IP stack</text>
  <text x="40" y="258" font-size="15" fill="#9aa3b5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">for that OS — and the MCP servers that let AI</text>
  <text x="40" y="280" font-size="15" fill="#9aa3b5" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">agents boot it, debug it, and read its hardware.</text>
  <g><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" from="0" to="1" begin="1.13s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.13s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <rect x="530" y="44" width="318" height="44" rx="10" fill="#111623" stroke="#34d399" stroke-opacity="0.55"/>
    <rect x="530" y="44" width="5" height="44" rx="2.5" fill="#34d399"/>
    <text x="552" y="71.5" font-size="15" font-weight="700" fill="#eef1f7" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">13 MCP servers</text>
    <text x="832" y="71" text-anchor="end" font-size="11.5" fill="#9aa3b5" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">boot · debug · decode</text>
  </g>
  <g><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" from="0" to="1" begin="0.91s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.91s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <rect x="530" y="97" width="318" height="44" rx="10" fill="#111623" stroke="#22d3ee" stroke-opacity="0.55"/>
    <rect x="530" y="97" width="5" height="44" rx="2.5" fill="#22d3ee"/>
    <text x="552" y="124.5" font-size="15" font-weight="700" fill="#eef1f7" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">Mort</text>
    <text x="832" y="124" text-anchor="end" font-size="11.5" fill="#9aa3b5" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">my language → freestanding C</text>
  </g>
  <g><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" from="0" to="1" begin="0.69s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.69s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <rect x="530" y="150" width="318" height="44" rx="10" fill="#111623" stroke="#60a5fa" stroke-opacity="0.55"/>
    <rect x="530" y="150" width="5" height="44" rx="2.5" fill="#60a5fa"/>
    <text x="552" y="177.5" font-size="15" font-weight="700" fill="#eef1f7" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">mortnet</text>
    <text x="832" y="177" text-anchor="end" font-size="11.5" fill="#9aa3b5" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">DHCP · DNS · TCP · HTTP</text>
  </g>
  <g><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" from="0" to="1" begin="0.47s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.47s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <rect x="530" y="203" width="318" height="44" rx="10" fill="#111623" stroke="#a78bfa" stroke-opacity="0.55"/>
    <rect x="530" y="203" width="5" height="44" rx="2.5" fill="#a78bfa"/>
    <text x="552" y="230.5" font-size="15" font-weight="700" fill="#eef1f7" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">MORT OS</text>
    <text x="832" y="230" text-anchor="end" font-size="11.5" fill="#9aa3b5" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">kernel · desktop · MortFS</text>
  </g>
  <g><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.25s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <rect x="530" y="256" width="318" height="44" rx="10" fill="#111623" stroke="#f472b6" stroke-opacity="0.55"/>
    <rect x="530" y="256" width="5" height="44" rx="2.5" fill="#f472b6"/>
    <text x="552" y="283.5" font-size="15" font-weight="700" fill="#eef1f7" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">real hardware</text>
    <text x="832" y="283" text-anchor="end" font-size="11.5" fill="#9aa3b5" font-family="'JetBrains Mono','Cascadia Code','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace">x86 · BIOS/UEFI · USB</text>
  </g>
</svg>
